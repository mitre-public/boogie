name: arinc-benchmark

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: arinc-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cifp:
    name: CIFP JMH
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify CIFP Fixture
        run: |
          fixture=boogie-arinc/src/test/resources/cifp-2101.dat.gz
          printf '%s  %s\n' \
            97acdd1f623c487c9ad0b40b10b1356d3bac6c3e3e8af68d031346c810548e8a \
            "${fixture}" | sha256sum --check -
          gzip -t "${fixture}"

      - name: Run CIFP Full Benchmark
        run: ./gradlew :boogie-arinc:jmhCifp

      - name: Run CIFP Navigation Benchmark
        run: ./gradlew :boogie-arinc:jmhCifpNav

      - name: Record Environment
        run: |
          report_dir=boogie-arinc/build/reports/jmh
          mkdir -p "${report_dir}"
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            java -version
            uname -a
            lscpu
          } > "${report_dir}/cifp-environment.txt" 2>&1

      - name: Add Benchmark Summary
        run: |
          {
            echo "### CIFP JMH"
            echo
            jq -r '.[] | .secondaryMetrics["gc.alloc.rate.norm"] as $allocation | "#### \(.params.specSet)\n\n- Time: \(.primaryMetric.score) ± \(.primaryMetric.scoreError) \(.primaryMetric.scoreUnit)\n- Allocation: \($allocation.score) ± \($allocation.scoreError) \($allocation.scoreUnit)"' \
              boogie-arinc/build/reports/jmh/cifp.json \
              boogie-arinc/build/reports/jmh/cifp-nav.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload CIFP Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arinc-jmh-cifp-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            boogie-arinc/build/reports/jmh/cifp.json
            boogie-arinc/build/reports/jmh/cifp-nav.json
            boogie-arinc/build/reports/jmh/cifp-environment.txt
          if-no-files-found: error
          retention-days: 90

  lido:
    name: LIDO JMH
    # Fork and Dependabot PRs cannot access the private LIDO fixture.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BOOGIE_LIDO_BENCHMARK_FILE: ${{ github.workspace }}/benchmark-data/lido/A424-22std.dat.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout LIDO Fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitre-tdp/boogie-test
          ref: main
          path: benchmark-data/lido
          lfs: true
          persist-credentials: false
          ssh-key: ${{ secrets.BOOGIE_TESTS_PRIVATE_KEYS }}

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify LIDO Fixture
        run: |
          printf '%s  %s\n' \
            43f864679cd7d5a4d72c24a8e21526be2cf52a9c2015fb344f63e1d8d2edeb4e \
            "${BOOGIE_LIDO_BENCHMARK_FILE}" | sha256sum --check -
          gzip -t "${BOOGIE_LIDO_BENCHMARK_FILE}"

      - name: Run LIDO Full Benchmark
        run: ./gradlew :boogie-arinc:jmhLido

      - name: Run LIDO Navigation Benchmark
        run: ./gradlew :boogie-arinc:jmhLidoNav

      - name: Record Environment
        run: |
          report_dir=boogie-arinc/build/reports/jmh
          mkdir -p "${report_dir}"
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            java -version
            uname -a
            lscpu
          } > "${report_dir}/lido-environment.txt" 2>&1

      - name: Add Benchmark Summary
        run: |
          {
            echo "### LIDO JMH"
            echo
            jq -r '.[] | .secondaryMetrics["gc.alloc.rate.norm"] as $allocation | "#### \(.params.specSet)\n\n- Time: \(.primaryMetric.score) ± \(.primaryMetric.scoreError) \(.primaryMetric.scoreUnit)\n- Allocation: \($allocation.score) ± \($allocation.scoreError) \($allocation.scoreUnit)"' \
              boogie-arinc/build/reports/jmh/lido.json \
              boogie-arinc/build/reports/jmh/lido-nav.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload LIDO Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arinc-jmh-lido-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            boogie-arinc/build/reports/jmh/lido.json
            boogie-arinc/build/reports/jmh/lido-nav.json
            boogie-arinc/build/reports/jmh/lido-environment.txt
          if-no-files-found: error
          retention-days: 90
