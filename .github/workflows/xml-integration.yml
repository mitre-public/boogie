name: xml-integration

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      conversion_fixtures:
        description: 'Regenerate and validate full CIFP/DAFIF XML and EXI fixtures'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: XML Test Data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.conversion_fixtures }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          repository: 'mitre-tdp/boogie-test'
          ssh-key: ${{ secrets.BOOGIE_TESTS_PRIVATE_KEYS }}
          ref: main
          path: ./.xml-conversion-fixtures

      - name: Prepare conversion inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.conversion_fixtures }}
        run: |
          cp .xml-conversion-fixtures/DAFIF8_1_2601.zip boogie-xml/src/test/resources/
          cp boogie-arinc/src/test/resources/cifp-2101.dat.gz boogie-xml/src/test/resources/
          if [ -d .xml-conversion-fixtures/v23_4/schemas ]; then
            cp -R .xml-conversion-fixtures/v23_4/schemas boogie-xml/src/test/resources/v23_4/
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: XML loading integration
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.conversion_fixtures }}
        run: ./gradlew :boogie-xml:xml-integration

      - name: XML fixture conversion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.conversion_fixtures }}
        run: ./gradlew :boogie-xml:xml-integration -PxmlConversionFixtures=true
